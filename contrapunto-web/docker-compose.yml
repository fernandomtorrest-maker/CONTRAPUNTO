version: '3.9'

# ==========================================
# Constructora Contrapunto — Docker Compose
# VPS Ubuntu con Nginx como reverse proxy
# ==========================================

services:
  # ── Aplicación Next.js ──────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contrapunto-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Variables de entorno de la aplicación (rellenar antes de producción)
      - NEXT_PUBLIC_SITE_URL=https://constructoracontrapunto.cl
      - WHATSAPP_NUMBER=56912345678
      # Almacenamiento en la nube (descomentar según proveedor)
      # AWS S3:
      # - AWS_REGION=us-east-1
      # - AWS_ACCESS_KEY_ID=your_access_key
      # - AWS_SECRET_ACCESS_KEY=your_secret_key
      # - S3_BUCKET_NAME=contrapunto-uploads
      # Google Cloud Storage:
      # - GCS_BUCKET_NAME=contrapunto-uploads
      # - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-credentials.json
    ports:
      - '3000:3000'
    networks:
      - contrapunto-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ── Nginx Reverse Proxy ──────────────────
  # Descomenta este servicio cuando tengas Nginx configurado en el VPS
  # nginx:
  #   image: nginx:alpine
  #   container_name: contrapunto-nginx
  #   restart: unless-stopped
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     web:
  #       condition: service_healthy
  #   networks:
  #     - contrapunto-net

networks:
  contrapunto-net:
    driver: bridge

# Volúmenes para persistencia (activar según necesidad)
# volumes:
#   uploads:
#     driver: local
